  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

function report(){const steps=[&#x27;Product&#x27;,&#x27;Evidence&#x27;,&#x27;Concern&#x27;,&#x27;Review&#x27;];let body=&#x27;&#x27;;if(state.step===0)body=`&lt;h2&gt;Start with the product.&lt;/h2&gt;&lt;p&gt;Enough detail to recognize the label you saw.&lt;/p&gt;${field(&#x27;Product name&#x27;,&#x27;product&#x27;,state.product)}${field(&#x27;Brand&#x27;,&#x27;brand&#x27;,state.brand)}&lt;div class=&quot;fr-twocol&quot;&gt;${field(&#x27;Variant · optional&#x27;,&#x27;variant&#x27;,state.variant)}${field(&#x27;Batch number · optional&#x27;,&#x27;batch&#x27;,&#x27;&#x27;)}&lt;/div&gt;${field(&#x27;Observation date · optional&#x27;,&#x27;date&#x27;,&#x27;&#x27;, &#x27;date&#x27;)}`;if(state.step===1)body=`&lt;h2&gt;Let the label speak.&lt;/h2&gt;&lt;p&gt;Show the product identity, gluten-free claim and ingredient list. One photo can cover all three.&lt;/p&gt;&lt;div class=&quot;fr-drop&quot;&gt;${icon(&#x27;image-up&#x27;)}&lt;p&gt;Add your label photographs&lt;/p&gt;&lt;small&gt;Sample or redacted images only · JPG, PNG or WebP&lt;/small&gt;&lt;input type=&quot;file&quot; id=&quot;fr-file&quot; accept=&quot;image/jpeg,image/png,image/webp&quot; aria-label=&quot;Choose label image&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fr-textlink&quot; data-command=&quot;sample-evidence&quot;&gt;Use the supplied sample instead&lt;/button&gt;&lt;/div&gt;${state.evidence?`&lt;div class=&quot;fr-evidence-row&quot;&gt;&lt;img src=&quot;${state.localImage||PHOTO}&quot; alt=&quot;Selected sample label&quot;&gt;&lt;div&gt;&lt;p&gt;Sample label&lt;/p&gt;&lt;small&gt;Identity · claim · ingredients&lt;/small&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;fr-textlink&quot; data-command=&quot;remove-evidence&quot;&gt;Remove&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;p class=&quot;fr-footnote&quot;&gt;Receipts are optional. In the app, original photos stay private.&lt;/p&gt;`;if(state.step===2)body=`&lt;h2&gt;What doesn&#x27;t add up?&lt;/h2&gt;&lt;p&gt;Describe what you can see. You don&#x27;t need to make a legal claim.&lt;/p&gt;&lt;label class=&quot;fr-field&quot;&gt;Your concern&lt;textarea data-field=&quot;concern&quot; rows=&quot;3&quot;&gt;${esc(state.concern)}&lt;/textarea&gt;&lt;/label&gt;${field(&#x27;Gluten-free wording&#x27;,&#x27;claim&#x27;,state.claim)}&lt;label class=&quot;fr-field&quot;&gt;Ingredient wording&lt;textarea data-field=&quot;ingredients&quot; rows=&quot;2&quot;&gt;${esc(state.ingredients)}&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;fr-check&quot;&gt;&lt;input id=&quot;fr-facts&quot; type=&quot;checkbox&quot; ${state.confirmed?&#x27;checked&#x27;:&#x27;&#x27;}&gt;I&#x27;ve checked this wording against the label.&lt;/label&gt;`;if(state.step===3)body=`&lt;h2&gt;Keep the facts together.&lt;/h2&gt;&lt;p&gt;Your report starts private. Sharing and external sending are separate choices.&lt;/p&gt;&lt;dl class=&quot;fr-rulelist&quot;&gt;&lt;div&gt;&lt;dt&gt;Product&lt;/dt&gt;&lt;dd&gt;${esc(state.product)}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Brand&lt;/dt&gt;&lt;dd&gt;${esc(state.brand)}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Label evidence&lt;/dt&gt;&lt;dd&gt;${state.evidence?&#x27;Sample attached&#x27;:&#x27;Still needed for sharing&#x27;}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Confirmed facts&lt;/dt&gt;&lt;dd&gt;${state.confirmed?&#x27;Checked by you&#x27;:&#x27;Not yet confirmed&#x27;}&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;p&gt;${esc(state.concern)}&lt;/p&gt;&lt;div class=&quot;fr-inset&quot;&gt;&lt;p&gt;You can save an incomplete private draft and come back to it.&lt;/p&gt;&lt;/div&gt;`;return `${head(&#x27;Raise a concern.&#x27;,&#x27;A few clear facts can make a useful record.&#x27;)}&lt;div class=&quot;fr-workspace&quot;&gt;&lt;aside&gt;&lt;ol class=&quot;fr-steps&quot;&gt;${steps.map((name,i)=&gt;`&lt;li&gt;&lt;button type=&quot;button&quot; data-step=&quot;${i}&quot; ${state.step===i?&#x27;aria-current=&quot;step&quot;&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;fr-stepnum&quot;&gt;${i+1}&lt;/span&gt;${name}&lt;/button&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;p class=&quot;fr-footnote&quot;&gt;Private draft&lt;br&gt;Nothing has been sent.&lt;/p&gt;&lt;/aside&gt;&lt;section class=&quot;fr-form&quot;&gt;${body}&lt;div class=&quot;fr-form-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fr-textlink&quot; data-command=&quot;save&quot;&gt;Save private draft&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;fr-primary&quot; data-command=&quot;next&quot;&gt;${state.step===3?&#x27;Open my report&#x27;:&#x27;Continue&#x27;}${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;}
function share(){return `${head(&#x27;Your community version.&#x27;,&#x27;Preview exactly what you are proposing to share.&#x27;)}&lt;div class=&quot;fr-split&quot;&gt;&lt;section&gt;${photo()}&lt;p class=&quot;fr-footnote&quot;&gt;Only selected, reviewed images will be shared.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;fr-form&quot;&gt;&lt;h2&gt;${esc(state.product)}&lt;/h2&gt;&lt;p&gt;${esc(state.brand)} · Anonymous contributor&lt;/p&gt;&lt;div class=&quot;fr-quote&quot;&gt;&lt;p&gt;${esc(state.concern)}&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;fr-small&quot;&gt;Account details, receipts and private correspondence are excluded.&lt;/p&gt;&lt;label class=&quot;fr-check&quot;&gt;&lt;input id=&quot;fr-consent&quot; type=&quot;checkbox&quot;&gt;I want this version and the selected images shared with the pilot community after review.&lt;/label&gt;&lt;div id=&quot;fr-share-error&quot; class=&quot;fr-error&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;fr-primary&quot; data-command=&quot;request-review&quot;&gt;Request publication review${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;div class=&quot;fr-actions&quot;&gt;${link(&#x27;Keep this private&#x27;,&#x27;timeline&#x27;)}&lt;/div&gt;&lt;p class=&quot;fr-footnote&quot;&gt;This does not send an email or file a government complaint.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;`;}

ubmission.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;fr-secondary&quot; data-command=&quot;handoff&quot;&gt;Preview external handoff${icon(&#x27;external-link&#x27;)}&lt;/button&gt;&lt;p class=&quot;fr-footnote&quot;&gt;Do not send fictional complaints to real recipients.&lt;/p&gt;${link(&#x27;Record a submission&#x27;,&#x27;timeline&#x27;)}&lt;/aside&gt;&lt;/div&gt;`;}
function timeline(){return `${head(state.saved?esc(state.product):&#x27;Your private record.&#x27;,&#x27;Sample Pantry · sample report&#x27;,secondary(&#x27;Edit report&#x27;,&#x27;report&#x27;))}&lt;div class=&quot;fr-summary-strip&quot;&gt;&lt;div&gt;&lt;span&gt;Preparation&lt;/span&gt;${state.confirmed&amp;&amp;state.evidence?&#x27;Ready&#x27;:&#x27;Draft&#x27;}&lt;/div&gt;&lt;div&gt;&lt;span&gt;Community visibility&lt;/span&gt;${state.published?&#x27;Published in preview&#x27;:state.pending?&#x27;Pending review&#x27;:&#x27;Private&#x27;}&lt;/div&gt;&lt;div&gt;&lt;span&gt;Personal follow-up&lt;/span&gt;${state.closed?&#x27;Closed by reporter&#x27;:&#x27;Open&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fr-split&quot;&gt;&lt;section&gt;&lt;h2&gt;Actions &amp; responses&lt;/h2&gt;&lt;div style=&quot;margin-top:26px&quot;&gt;&lt;div class=&quot;fr-timeline-item&quot;&gt;&lt;small&gt;Inside FoodProof&lt;/small&gt;&lt;p&gt;Private report prepared&lt;/p&gt;&lt;/div&gt;${state.pending?&#x27;&lt;div class=&quot;fr-timeline-item&quot;&gt;&lt;small&gt;Inside FoodProof&lt;/small&gt;&lt;p&gt;Community review requested&lt;/p&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}${state.published?&#x27;&lt;div class=&quot;fr-timeline-item&quot;&gt;&lt;small&gt;Inside FoodProof&lt;/small&gt;&lt;p&gt;Reviewed snapshot shared in preview&lt;/p&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;fr-timeline-item&quot;&gt;&lt;small&gt;Brand&lt;/small&gt;&lt;p&gt;${state.submitted?&#x27;Sample submission recorded by reporter&#x27;:&#x27;No external submission recorded&#x27;}&lt;/p&gt;${state.response?&#x27;&lt;p&gt;Private response added · not shared&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;fr-timeline-item&quot;&gt;&lt;small&gt;Government&lt;/small&gt;&lt;p&gt;No external submission recorded&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fr-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fr-secondary&quot; data-command=&quot;submission&quot;&gt;Record submission&lt;/button&gt;${secondary(&#x27;Add a response&#x27;,&#x27;response&#x27;)}&lt;/div&gt;&lt;div id=&quot;fr-submission-slot&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;aside class=&quot;fr-side-note&quot;&gt;&lt;h3&gt;Your next step&lt;/h3&gt;&lt;p class=&quot;fr-small&quot;&gt;Prepare a complaint, or decide what the community should see.&lt;/p&gt;&lt;div class=&quot;fr-actions&quot;&gt;${primary(&#x27;Prepare complaint&#x27;,&#x27;action&#x27;)}${link(&#x27;Manage community sharing&#x27;,&#x27;share&#x27;)}&lt;/div&gt;${state.published?&#x27;&lt;button type=&quot;button&quot; class=&quot;fr-textlink&quot; data-command=&quot;withdraw&quot;&gt;Withdraw community sharing&lt;/button&gt;&#x27;:&#x27;&#x27;}&lt;div style=&quot;margin-top:30px;border-top:1px solid var(--fr-rule);padding-top:16px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fr-textlink&quot; data-command=&quot;close&quot;&gt;${state.closed?&#x27;Reopen my complaint&#x27;:&#x27;Close my complaint&#x27;}&lt;/button&gt;&lt;div id=&quot;fr-close-slot&quot;&gt;&lt;/div&gt;&lt;p class=&quot;fr-footnote&quot;&gt;Closure does not mean a label was fixed or a product is safe.&lt;/p&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;`;}

function review(){return `${head(&#x27;A considered review.&#x27;,&#x27;Review the version the contributor has asked to share.&#x27;,status(state.pending?&#x27;Pending concern&#x27;:&#x27;Sample review&#x27;))}&lt;div class=&quot;fr-review-shell&quot;&gt;&lt;section&gt;${photo()}&lt;p class=&quot;fr-footnote&quot;&gt;Fictional evidence. Original private files are not public assets.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;fr-form&quot;&gt;&lt;h2&gt;${esc(state.product)}&lt;/h2&gt;&lt;p&gt;${esc(state.brand)} · Proposed community version&lt;/p&gt;&lt;div class=&quot;fr-quote&quot;&gt;&lt;p&gt;${esc(state.concern)}&lt;/p&gt;&lt;/div&gt;&lt;label class=&quot;fr-check&quot;&gt;&lt;input id=&quot;fr-check-evidence&quot; type=&quot;checkbox&quot;&gt;Identity, claim, ingredient list and explanation are complete.&lt;/label&gt;&lt;label class=&quot;fr-check&quot;&gt;&lt;input id=&quot;fr-check-privacy&quot; type=&quot;checkbox&quot;&gt;The proposed content is factual and contains no private details.&lt;/label&gt;&lt;label class=&quot;fr-field&quot;&gt;Reason or requested changes&lt;textarea id=&quot;fr-review-reason&quot; rows=&quot;2&quot; placeholder=&quot;Required for changes or rejection&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;fr-error&quot; id=&quot;fr-review-error&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fr-review-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fr-primary&quot; data-command=&quot;approve&quot;&gt;Approve publication${icon(&#x27;check&#x27;)}&lt;/button&gt;&lt;div class=&quot;fr-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fr-textlink&quot; data-command=&quot;changes&quot;&gt;Request changes&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;fr-textlink&quot; data-command=&quot;reject&quot;&gt;Reject&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;fr-footnote&quot;&gt;This review checks evidence and privacy. It does not certify product safety.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;`;}
const pages={home:homepage,entry,feed,detail,report,share,action,timeline,response,review};

picker.addEventListener(&#x27;change&#x27;,()=&gt;show(picker.value));

root.addEventListener(&#x27;click&#x27;,async e=&gt;{const b=e.target.closest(&#x27;button&#x27;);if(!b)return;capture();if(b.dataset.route){show(b.dataset.route);return;}if(b.dataset.scroll){root.querySelector(&#x27;#&#x27;+b.dataset.scroll).scrollIntoView({behavior:matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches?&#x27;auto&#x27;:&#x27;smooth&#x27;,block:&#x27;start&#x27;});return;}if(b.dataset.step){state.step=Number(b.dataset.step);show(&#x27;report&#x27;);return;}if(b.dataset.channel){state.channel=b.dataset.channel;show(&#x27;action&#x27;);return;}switch(b.dataset.command){
case &#x27;enter&#x27;:if(!root.querySelector(&#x27;#fr-invite&#x27;).value){root.querySelector(&#x27;#fr-entry-error&#x27;).textContent=&#x27;Enter a sample code to explore. No real authentication occurs here.&#x27;;break;}show(&#x27;feed&#x27;);break;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
